<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — ShaadiWords</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ivory:#FBF6ED; --maroon:#6B1E2B; --maroon-deep:#4A1420; --gold:#D9A441; --ink:#2A1B1E; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ivory);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.7;}
  .wrap{max-width:600px;margin:0 auto;padding:60px 24px 100px;text-align:center;}
  a{color:var(--maroon);}
  h1{font-family:'Cormorant Garamond',serif;font-size:40px;color:var(--maroon-deep);margin-bottom:16px;}
  p{font-size:16px;color:#3a2c2e;}
  .back{display:inline-block;margin-bottom:30px;font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--maroon);text-decoration:none;}
  .contact-card{
    background:#fff;border:1px solid rgba(107,30,43,0.15);border-radius:16px;
    padding:30px;margin-top:30px;box-shadow:0 14px 30px -20px rgba(107,30,43,0.3);
  }
  .contact-link{
    display:block;margin:14px 0;font-family:'IBM Plex Mono',monospace;font-size:14px;
    color:var(--maroon-deep);text-decoration:none;padding:12px;border-radius:10px;
    border:1px solid rgba(107,30,43,0.15);transition:background .15s ease;
  }
  .contact-link:hover{background:var(--ivory);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&larr; Back to ShaadiWords</a>
  <h1>Get in Touch</h1>
  <p>Questions, feedback, bug reports, or partnership ideas — reach out any of these ways:</p>

  <div class="contact-card">
    <a class="contact-link" href="mailto:YOUR-EMAIL@example.com">✉ sreeshanthgundamani@gmail.com</a>
    <a class="contact-link" href="https://wa.me/91YOURNUMBER" target="_blank" rel="noopener">💬 WhatsApp</a>
  </div>

  <p style="margin-top:30px;font-size:13px;color:#8a776e;">We try to respond within a couple of days.</p>
</div>
</body>
</html>
